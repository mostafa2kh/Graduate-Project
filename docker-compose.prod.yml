# RentSphere — Production Docker Compose
# Start with:
#   docker compose -f docker-compose.prod.yml up -d
# Stop with:
#   docker compose -f docker-compose.prod.yml down

services:
  # ══════════════════════════════════════════════
  # Infrastructure
  # ══════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: rentsphere-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentsphere}
      POSTGRES_DB: ${POSTGRES_DB:-rentsphere_auth_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentsphere}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentsphere-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: rentsphere-redpanda
    restart: unless-stopped
    ports:
      - "${REDPANDA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: rentsphere-redpanda-console
    restart: unless-stopped
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8099}:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }
    networks:
      - rentsphere-network

  # ══════════════════════════════════════════════
  # API Gateway
  # ══════════════════════════════════════════════
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: rentsphere-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      LISTING_SERVICE_URL: http://listing-service:8083
      MEDIA_SERVICE_URL: http://media-service:8084
      AI_REVIEW_SERVICE_URL: http://ai-review-service:8085
      MODERATION_SERVICE_URL: http://moderation-service:8086
      VERIFICATION_SERVICE_URL: http://verification-service:8087
      PAYMENT_SERVICE_URL: http://payment-service:8088
      NOTIFICATION_SERVICE_URL: http://notification-service:8089
      CHAT_SERVICE_URL: http://chat-service:8090
      SEARCH_SERVICE_URL: http://search-service:8091
      BOOKING_SERVICE_URL: http://booking-service:8092
      AUDIT_SERVICE_URL: http://audit-service:8093
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ══════════════════════════════════════════════
  # Auth Service
  # ══════════════════════════════════════════════
  auth-service:
    build: ./backend/auth-service
    container_name: rentsphere-auth-service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rentsphere_auth_db
      DB_USERNAME: ${POSTGRES_USER:-rentsphere}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rentsphere}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
