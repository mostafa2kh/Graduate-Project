  # ══════════════════════════════════════════════
  frontend:
    build: ./frontend
    container_name: rentsphere-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway: { condition: service_started }
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  redpanda-data:
    driver: local
  media-uploads:
    driver: local

networks:
  rentsphere-network:
    driver: bridge
