server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rentsphere_media_db
    username: rentsphere
    password: rentsphere
  jpa:
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 210MB

media:
  storage:
    local:
      upload-dir: ./media-uploads

jwt:
  secret: rentsphere-dev-jwt-secret-key-change-in-production
  access-token-minutes: 180
