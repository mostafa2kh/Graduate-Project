server:
  port: 8086

spring:
  application:
    name: moderation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rentsphere_moderation_db}
    username: ${DB_USERNAME:rentsphere}
    password: ${DB_PASSWORD:rentsphere}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

services:
  listing:
    url: ${LISTING_SERVICE_URL:http://localhost:8083}
  ai-review:
    url: ${AI_REVIEW_SERVICE_URL:http://localhost:8085}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-string-that-is-at-least-256-bits-long}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

logging:
  level:
    com.rentsphere: INFO
    org.springframework.security: INFO
