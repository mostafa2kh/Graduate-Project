server:
  port: ${GATEWAY_PORT:8080}

spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: listing-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/listings/**
          filters:
            - StripPrefix=1

        - id: media-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/media/**
          filters:
            - StripPrefix=1

        - id: ai-review-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/ai-review/**
          filters:
            - StripPrefix=1

        - id: moderation-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: verification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/verification/**
          filters:
            - StripPrefix=1

        - id: search-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=1

        - id: booking-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=1

        - id: payment-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1

        - id: chat-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

        - id: audit-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/admin/audit/**
          filters:
            - StripPrefix=1

spring.cloud.gateway.default-filters:
  - DedupeResponseHeader=Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
