server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rentsphere_auth_db}
    username: ${DB_USERNAME:rentsphere}
    password: ${DB_PASSWORD:rentsphere}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: false
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-string-that-is-at-least-256-bits-long}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

logging:
  level:
    com.rentsphere: INFO
