services:
  # ──────────────────────────────────────────────────
  # PostgreSQL — One instance with multiple databases
  # ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rentsphere-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentsphere}
      POSTGRES_DB: ${POSTGRES_DB:-rentsphere_auth_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentsphere}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────
  # Redis — Cache, rate-limit, token blacklist
  # ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rentsphere-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────
  # Redpanda — Kafka-compatible event broker
  # ──────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: rentsphere-redpanda
    restart: unless-stopped
    ports:
      - "${REDPANDA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - rentsphere-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redpanda Console — Web UI for Kafka management
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: rentsphere-redpanda-console
    restart: unless-stopped
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8099}:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - rentsphere-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  redpanda-data:
    driver: local

networks:
  rentsphere-network:
    driver: bridge
