name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentsphere
          POSTGRES_PASSWORD: rentsphere
          POSTGRES_DB: rentsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - listing-service
          - media-service
          - ai-review-service
          - moderation-service
          - verification-service
          - search-service
          - booking-service
          - payment-service
          - chat-service
          - notification-service
          - audit-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: mvn compile -q
        # Add -Dspring.profiles.active=test if integration tests exist later

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-build, frontend-build]

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - listing-service
          - media-service
          - ai-review-service
          - moderation-service
          - verification-service
          - search-service
          - booking-service
          - payment-service
          - chat-service
          - notification-service
          - audit-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          push: false
          tags: rentsphere/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-docker:
    name: Frontend Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: rentsphere/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
